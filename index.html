<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테트리스</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="main-content">
        <div id="intro-screen" class="screen active">
            <h1 class="title">사이버펑크 테트리스</h1>
            <p class="subtitle">이름을 입력하고 시작하세요</p>
            <input type="text" id="player-name" placeholder="이름 입력">
            <div class="button-group">
                <button id="start-game">게임 시작</button>
                <button id="open-partnership" class="secondary-btn">제휴 문의</button>
            </div>
        </div>

        <div id="partnership-screen" class="screen">
            <h1 class="title">제휴 문의</h1>
            <form id="partnership-form" action="https://formspree.io/f/mqenjlzg" method="POST">
                <div class="form-group">
                    <label for="name">성함 / 담당자명</label>
                    <input type="text" id="name" name="name" required placeholder="성함을 입력해주세요">
                </div>
                <div class="form-group">
                    <label for="email">이메일 주소</label>
                    <input type="email" id="email" name="email" required placeholder="example@domain.com">
                </div>
                <div class="form-group">
                    <label for="company">회사명 / 소속</label>
                    <input type="text" id="company" name="company" placeholder="회사명을 입력해주세요">
                </div>
                <div class="form-group">
                    <label for="message">제휴 내용</label>
                    <textarea id="message" name="message" required placeholder="제휴하고 싶은 내용을 적어주세요" rows="5"></textarea>
                </div>
                <div class="button-group">
                    <button type="submit" id="submit-form">문의 보내기</button>
                    <button type="button" id="back-to-home" class="secondary-btn">뒤로 가기</button>
                </div>
                <p id="form-status"></p>
            </form>
        </div>

        <div id="game-screen" class="screen">
            <div id="game-container">
                <canvas id="tetris-board" width="300" height="600"></canvas>
                <div id="game-info">
                    <h1 class="title">테트리스</h1>
                    <div class="info-item">
                        <h2>점수</h2>
                        <p id="score">0</p>
                    </div>
                    <div class="info-item">
                        <h2>다음</h2>
                        <canvas id="next-piece" width="120" height="120"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div id="leaderboard-screen" class="screen">
            <h1 class="title">리더보드</h1>
            <table id="leaderboard-table">
                <thead>
                    <tr>
                        <th>순위</th>
                        <th>이름</th>
                        <th>점수</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
            <button id="play-again">다시하기</button>
        </div>
        
        <div id="disqus-container">
            <h2 class="title">댓글</h2>
            <div id="disqus_thread"></div>
            <script>
                /**
                *  RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS.
                *  LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables    */

                var disqus_config = function () {
                this.page.url = PAGE_URL;  // Replace PAGE_URL with your page's canonical URL variable
                this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable
                };
                */
                (function() { // DON'T EDIT BELOW THIS LINE
                var d = document, s = d.createElement('script');
                s.src = 'https://pdbuilder.disqus.com/embed.js';
                s.setAttribute('data-timestamp', +new Date());
                (d.head || d.body).appendChild(s);
                })();
            </script>
            <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
