<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이버펑크 유니버스</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <!-- Teachable Machine Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
</head>
<body>
    <div id="main-content">
        <!-- Intro Screen -->
        <div id="intro-screen" class="screen active">
            <h1 class="title">사이버펑크 유니버스</h1>
            <p class="subtitle">모드를 선택하세요</p>
            <div class="mode-selection">
                <div class="mode-card" id="mode-tetris">
                    <h2>테트리스</h2>
                    <p>클래식 블록 쌓기</p>
                    <button class="primary-btn">입장</button>
                </div>
                <div class="mode-card" id="mode-animal">
                    <h2>동물상 테스트</h2>
                    <p>AI가 분석하는 나의 동물상</p>
                    <button class="primary-btn">입장</button>
                </div>
            </div>
            <div class="button-group" style="margin-top: 30px;">
                <button id="open-partnership" class="secondary-btn">제휴 문의</button>
            </div>
        </div>

        <!-- Tetris Setup Screen -->
        <div id="tetris-setup-screen" class="screen">
            <h1 class="title">테트리스</h1>
            <p class="subtitle">이름을 입력하고 시작하세요</p>
            <input type="text" id="player-name" placeholder="이름 입력">
            <div class="button-group">
                <button id="start-game">게임 시작</button>
                <button class="back-to-home-btn secondary-btn">뒤로 가기</button>
            </div>
        </div>

        <!-- Animal Test Screen -->
        <div id="animal-test-screen" class="screen">
            <h1 class="title">동물상 테스트</h1>
            <p class="subtitle">AI가 당신의 얼굴을 분석합니다</p>
            
            <div id="upload-container">
                <div id="image-preview-container">
                    <img id="face-image" src="" alt="미리보기" style="display: none;">
                    <div id="scan-line" style="display: none;"></div>
                    <div id="upload-placeholder">
                        <p>사진을 클릭하여 업로드하세요</p>
                        <input type="file" id="image-upload" accept="image/*" style="display: none;">
                    </div>
                </div>
                
                <div id="results-container" style="display: none;">
                    <h2 class="highlight">분석 결과</h2>
                    <div id="label-container"></div>
                </div>

                <div class="button-group">
                    <button id="analyze-btn" class="primary-btn" style="display: none;">분석하기</button>
                    <button id="reset-animal-test" class="secondary-btn" style="display: none;">다시 하기</button>
                    <button class="back-to-home-btn secondary-btn">뒤로 가기</button>
                </div>
            </div>
            <div id="loading-model" style="display: none; margin-top: 20px;">AI 모델을 불러오는 중...</div>
        </div>

        <!-- Partnership Screen -->
        <div id="partnership-screen" class="screen">
            <h1 class="title">제휴 문의</h1>
            <form id="partnership-form" action="https://formspree.io/f/mqenjlzg" method="POST">
                <div class="form-group">
                    <label for="name">성함 / 담당자명</label>
                    <input type="text" id="name" name="name" required placeholder="성함을 입력해주세요">
                </div>
                <div class="form-group">
                    <label for="email">이메일 주소</label>
                    <input type="email" id="email" name="email" required placeholder="example@domain.com">
                </div>
                <div class="form-group">
                    <label for="company">회사명 / 소속</label>
                    <input type="text" id="company" name="company" placeholder="회사명을 입력해주세요">
                </div>
                <div class="form-group">
                    <label for="message">제휴 내용</label>
                    <textarea id="message" name="message" required placeholder="제휴하고 싶은 내용을 적어주세요" rows="5"></textarea>
                </div>
                <div class="button-group">
                    <button type="submit" id="submit-form">문의 보내기</button>
                    <button type="button" class="back-to-home-btn secondary-btn">뒤로 가기</button>
                </div>
                <p id="form-status"></p>
            </form>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div id="game-container">
                <canvas id="tetris-board" width="300" height="600"></canvas>
                <div id="game-info">
                    <h1 class="title">테트리스</h1>
                    <div class="info-item">
                        <h2>점수</h2>
                        <p id="score">0</p>
                    </div>
                    <div class="info-item">
                        <h2>다음</h2>
                        <canvas id="next-piece" width="120" height="120"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Leaderboard Screen -->
        <div id="leaderboard-screen" class="screen">
            <h1 class="title">리더보드</h1>
            <table id="leaderboard-table">
                <thead>
                    <tr>
                        <th>순위</th>
                        <th>이름</th>
                        <th>점수</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
            <div class="button-group">
                <button id="play-again">다시하기</button>
                <button class="back-to-home-btn secondary-btn">홈으로</button>
            </div>
        </div>
        
        <!-- Disqus Container -->
        <div id="disqus-container">
            <h2 class="title" style="font-size: 1.5rem; margin-top: 50px;">커뮤니티</h2>
            <div id="disqus_thread"></div>
            <script>
                (function() {
                var d = document, s = d.createElement('script');
                s.src = 'https://pdbuilder.disqus.com/embed.js';
                s.setAttribute('data-timestamp', +new Date());
                (d.head || d.body).appendChild(s);
                })();
            </script>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
